name: Update Block Hub Content

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# يمنع تشغيل نسختين من البوت في نفس الوقت، ويصفّ أي تشغيلات إضافية
# بدل إلغائها، حتى لا يحدث أي تعارض على index.html.
concurrency:
  group: block-hub-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot (fetch Modrinth data and generate index.html)
        env:
          MODRINTH_USER_AGENT: ${{ secrets.MODRINTH_USER_AGENT }}
        run: python bot.py

      - name: Sync with latest remote changes
        run: |
          git fetch origin main
          # نتأكد أننا فوق أحدث نسخة من main قبل أي commit، بدون rebase
          # وبدون أي احتمال لتعارض على index.html لأن هذا الملف يُولَّد
          # بالكامل من البوت في كل مرة.
          git merge --ff-only origin/main || true

      - name: Commit and push if index.html changed
        run: |
          git config user.name "block-hub-bot"
          git config user.email "block-hub-bot@users.noreply.github.com"

          git add index.html

          if git diff --cached --quiet -- index.html; then
            echo "لا يوجد أي تغيير في index.html، لن يتم إنشاء commit."
          else
            git commit -m "chore: تحديث تلقائي للمحتوى من Modrinth [skip ci]"
            git push origin HEAD:main
            echo "تم دفع التحديث بنجاح."
          fi
