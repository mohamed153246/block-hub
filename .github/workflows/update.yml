name: تحديث مودات بلوك هَب

on:
  workflow_dispatch:

  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل المستودع
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: إعداد Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: تثبيت requests
        run: python -m pip install --upgrade pip requests

      - name: تشغيل البوت
        env:
          MODRINTH_USER_AGENT: ${{ secrets.MODRINTH_USER_AGENT }}
        run: python bot.py

      - name: حفظ التحديث
        run: |
          git config user.name "block-hub-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add mods_data.json

          if git diff --cached --quiet; then
            echo "لا توجد تغييرات."
            exit 0
          fi

          git commit -m "تحديث بيانات Minecraft"

          git pull --rebase origin main

          git push origin main
