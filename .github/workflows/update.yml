name: تحديث بلوك هَب تلقائياً

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: block-hub-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل المستودع
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: إعداد Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: تثبيت requests
        run: python -m pip install --upgrade pip requests

      - name: تشغيل البوت
        env:
          MODRINTH_USER_AGENT: ${{ secrets.MODRINTH_USER_AGENT }}
        run: python bot.py

      - name: رفع index.html
        run: |
          git config user.name "block-hub-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html

          if git diff --cached --quiet; then
            echo "لا توجد تغييرات جديدة."
            exit 0
          fi

          git commit -m "🤖 تحديث بيانات بلوك هَب"

          git push origin HEAD:main
